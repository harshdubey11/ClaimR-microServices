server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:

        - id: auth-service
          uri: http://auth-service:9002
          predicates:
            - Path=/auth/**

        - id: expense-service
          uri: http://expense-service:9000
          predicates:
            - Path=/expenses/**

        - id: approval-service
          uri: http://approval-service:9001
          predicates:
            - Path=/approval/**