
services:
  kafka:
    image: apache/kafka:latest
    container_name: claimr-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    networks:
      - finguard-network

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: finguard
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - finguard-network

  auth-service:
    build:
      context: ./authService

    container_name: auth-service
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

    ports:
      - "9002:9002"

    networks:
      - finguard-network

  expense-service:
    build:
      context: ./expenseService

    container_name: expense-service
    restart: unless-stopped

    depends_on:
      - postgres
      - auth-service

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      APPROVAL_SERVICE_URL: ${APPROVAL_SERVICE_URL}

    ports:
      - "9000:9000"

    networks:
      - finguard-network

  approval-service:
    build:
      context: ./approvalService

    container_name: approval-service
    restart: unless-stopped

    depends_on:
      - postgres
      - expense-service
      - kafka

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EXPENSE_SERVICE_URL: ${EXPENSE_SERVICE_URL}
      AUTH_SERVICE_URL: http://auth-service:9002
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094

    ports:
      - "9001:9001"

    networks:
      - finguard-network

  email-service:
    build:
      context: ./email-service

    container_name: email-service
    restart: unless-stopped

    depends_on:
      - kafka

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    networks:
      - finguard-network

  api-gateway:
    build:
      context: ./gateway

    container_name: api-gateway
    restart: unless-stopped

    depends_on:
      - auth-service
      - expense-service
      - approval-service

    ports:
      - "8080:8080"

    networks:
      - finguard-network
  frontend:
    build:
      context: ../finguard-UI
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: claimr-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      API_GATEWAY_HOST: api-gateway
    ports:
      - "3000:80"
    networks:
      - finguard-network 
networks:
  finguard-network:
    driver: bridge

volumes:
  postgres_data:
